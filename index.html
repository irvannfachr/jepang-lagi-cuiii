<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#e63946"><title>ことば道場 | Kotoba Dojo</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><div class="brand"><div class="logo">日</div><div><b>ことば道場</b><small>KOTOBA DOJO • N5</small></div></div><div class="flag">🇯🇵</div></header><main id="home"><section class="hero"><span>⛩️ JAPANESE VOCAB QUIZ</span><h1>Belajar Kotoba,<br><em>makin jago!</em></h1><p>Pilih bab atau campur bab. Soal Jepang ↔ Indonesia akan diacak otomatis.</p><strong>一緒に日本語を勉強しましょう！</strong></section><section class="panel"><h3>📖 Pilih Bab</h3><div id="chapters" class="chapters"></div><button id="mix" class="mix">🔀 Campur Semua Bab</button><div class="controls"><label>Jumlah soal<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option></select></label></div><button id="start" class="start">🎮 Mulai Quiz Campuran</button></section></main><main id="quiz" class="hidden"><div class="top"><button id="back" class="back">‹</button><div class="progress"><div><b id="qn"></b><b id="score">Skor: 0</b></div><i><span id="bar"></span></i></div></div><section class="quizcard"><small id="type"></small><div id="question" class="question"></div><div id="romaji" class="romaji"></div><p id="ask"></p><div id="answers" class="answers"></div><div id="typingArea" class="typing-area hidden"><div class="typing-title">⌨️ Pilih huruf Jepang</div><div class="input-wrapper"><input id="kotobaInput" type="text" lang="ja" readonly autocomplete="off" spellcheck="false" placeholder="Pencet huruf Jepang di bawah..."><button id="deleteChar" class="delete-char" type="button">⌫</button></div><div class="keyboard-tabs"><button id="hiraganaTab" class="keyboard-tab active" type="button">あ Hiragana</button><button id="katakanaTab" class="keyboard-tab" type="button">カ Katakana</button><button id="clearInput" class="keyboard-tab clear-key" type="button">Hapus</button></div><div id="jpKeyboard" class="jp-keyboard"></div><button id="submitTyping" class="submit-answer" type="button">✓ Periksa Jawaban</button></div><div id="feedback"></div><button id="next" class="next">Soal berikutnya →</button></section></main><main id="result" class="hidden"><section class="result"><div class="emoji">🎊</div><small>QUIZ SELESAI</small><h2 id="resultTitle"></h2><div id="final" class="final"></div><p id="summary"></p><div class="stats"><div><b id="correct"></b><small>BENAR</small></div><div><b id="wrong"></b><small>SALAH</small></div><div><b id="total"></b><small>TOTAL</small></div></div><div id="review" class="review"></div><div class="actions"><button id="retry" class="primary">🔄 Ulangi yang Salah</button><button id="menu" class="secondary">⌂ Menu Utama</button></div></section></main></div><footer>🇯🇵 <b>Created by Irpannn 😎</b></footer><script src="script.js"></script></body></html>
